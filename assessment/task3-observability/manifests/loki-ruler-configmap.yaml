apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alert-rules
  namespace: observability
  labels:
    app.kubernetes.io/part-of: hirelink-observability
data:
  hirelink-log-rules.yaml: |
    groups:
      - name: hirelink-log-alerts
        interval: 1m
        rules:
          - alert: HirelinkApiErrorSpike
            expr: |
              sum(rate({namespace="hirelink-prod",app="hirelink-api"} |= "ERROR" [5m])) > 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "API error logs are spiking"
              description: "hirelink-api is emitting more than 5 ERROR logs/sec over 5m."
