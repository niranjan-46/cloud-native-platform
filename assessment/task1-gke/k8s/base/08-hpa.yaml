apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hirelink-api-hpa
  namespace: hirelink-prod
spec:
  # API scales between 2 and 6 pods based on resource pressure.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hirelink-api
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hirelink-web-hpa
  namespace: hirelink-prod
spec:
  # Frontend scales between 2 and 4 pods based on resource pressure.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hirelink-web
  minReplicas: 2
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
