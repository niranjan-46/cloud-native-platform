name: Backend CI/CD (GKE)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "accounts/**"
      - "core/**"
      - "help/**"
      - "hirelink_api/**"
      - "jobs/**"
      - "payments/**"
      - "settings/**"
      - "subscriptions/**"
      - "manage.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/backend-cicd.yml"
  push:
    branches:
      - main
    paths:
      - "accounts/**"
      - "core/**"
      - "help/**"
      - "hirelink_api/**"
      - "jobs/**"
      - "payments/**"
      - "settings/**"
      - "subscriptions/**"
      - "manage.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/backend-cicd.yml"

permissions:
  contents: read

env:
  IMAGE_NAME: hirelink-api
  K8S_DEPLOYMENT: hirelink-api
  K8S_CONTAINER: app
  HEALTHCHECK_PATH: /health/
  HEALTHCHECK_PORT: "8000"

concurrency:
  group: backend-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: hirelink-production-db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hirelink-production-db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DJANGO_SECRET_KEY_PROD: ci-only-secret-key
      DB_NAME_PROD: hirelink-production-db
      DB_USER_PROD: postgres
      DB_PASSWORD_PROD: postgres
      DB_HOST_PROD: 127.0.0.1
      DB_PORT_PROD: "5432"
      DB_SSLMODE_PROD: disable
      USE_CLOUD_SQL_PROXY_PROD: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for i in {1..30}; do
            python - <<'PY'
import socket
s = socket.socket()
try:
    s.connect(("127.0.0.1", 5432))
    print("postgres up")
    raise SystemExit(0)
except Exception:
    raise SystemExit(1)
finally:
    s.close()
PY
            if [ $? -eq 0 ]; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL not ready in time"
          exit 1

      - name: Prepare DB schema
        run: |
          python - <<'PY'
import psycopg2
conn = psycopg2.connect(
    host="127.0.0.1",
    port=5432,
    dbname="hirelink-production-db",
    user="postgres",
    password="postgres",
)
conn.autocommit = True
cur = conn.cursor()
cur.execute("CREATE SCHEMA IF NOT EXISTS hirelink_app;")
cur.close()
conn.close()
PY

      - name: Django system checks
        run: python manage.py check

      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Unit tests
        run: python manage.py test --noinput

  build_scan_push:
    name: Build, Scan, Push
    needs: quality
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for GAR
        run: gcloud auth configure-docker ${{ secrets.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build image
        id: image
        run: |
          IMAGE_URI=${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build --pull --tag "$IMAGE_URI" .
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push image
        run: docker push "${{ env.IMAGE_URI }}"

  deploy_production:
    name: Deploy Production
    needs: build_scan_push
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment: production
    env:
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE_PRODUCTION || 'hirelink-prod' }}
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials "${{ secrets.GKE_CLUSTER }}" \
            --region "${{ secrets.GKE_LOCATION }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}"

      - name: Deploy image to GKE
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/"$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER"="${{ needs.build_scan_push.outputs.image_uri }}"
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/"$K8S_DEPLOYMENT" --timeout=300s

      - name: Run DB migrations
        run: |
          POD_NAME=$(kubectl -n "$K8S_NAMESPACE" get pods -l app="$K8S_DEPLOYMENT" -o jsonpath="{.items[0].metadata.name}")
          kubectl -n "$K8S_NAMESPACE" exec "$POD_NAME" -c "$K8S_CONTAINER" -- python manage.py migrate --noinput

      - name: Smoke check
        run: |
          POD_NAME=$(kubectl -n "$K8S_NAMESPACE" get pods -l app="$K8S_DEPLOYMENT" -o jsonpath="{.items[0].metadata.name}")
          kubectl -n "$K8S_NAMESPACE" exec "$POD_NAME" -c "$K8S_CONTAINER" -- \
            python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${HEALTHCHECK_PORT}${HEALTHCHECK_PATH}', timeout=10)"

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout undo deployment/"$K8S_DEPLOYMENT"
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/"$K8S_DEPLOYMENT" --timeout=300s
